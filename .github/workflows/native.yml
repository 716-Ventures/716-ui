name: Native GTK verification
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev weston dbus-x11 fonts-inter fonts-noto-cjk at-spi2-core python3-pyatspi
          pkg-config --modversion gtk4
          rustup toolchain install 1.85.1 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: native-arm64-rust185-${{ hashFiles('Cargo.lock') }}
      - name: Build and deterministic tests
        run: |
          cargo +1.85.1 test --locked --no-default-features
          cargo +1.85.1 test --locked
          cargo +1.85.1 build --locked
      - name: Native rendering and interaction
        run: dbus-run-session -- python3 tests/native_gallery.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-gallery-arm64
          path: test-output/

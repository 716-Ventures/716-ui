[package]
name = "seven-sixteen-ui"
version = "0.1.0-alpha.29"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Experimental native GTK 4 controls with a pinned shadcn reference"
repository = "https://github.com/716-Ventures/716-ui"

[features]
default = ["native"]
native = ["dep:gtk"]
terminal = ["native", "dep:vte"]

[[bin]]
name = "gallery"
path = "src/bin/gallery.rs"
required-features = ["native"]

[[bin]]
name = "button-states"
path = "src/bin/button_states.rs"
required-features = ["native"]

[[bin]]
name = "button-motion"
path = "src/bin/button_motion.rs"
required-features = ["native"]

[[bin]]
name = "button-metrics"
path = "src/bin/button_metrics.rs"
required-features = ["native"]

[[bin]]
name = "input-states"
path = "src/bin/input_states.rs"
required-features = ["native"]

[[bin]]
name = "tabs-states"
path = "src/bin/tabs_states.rs"
required-features = ["native"]

[[bin]]
name = "chart-states"
path = "src/bin/chart_states.rs"
required-features = ["native"]

[dependencies]
serde = {version="1",features=["derive"]}
serde_json = "1"
gtk = { package = "gtk4", version = "=0.9.7", features = ["v4_12"], optional = true }

vte = { package="vte4", version="=0.8.0", optional=true }

[profile.dev]
debug = 0

[profile.release]
debug = 0

[[bin]]
name = "toggle-states"
path = "src/bin/toggle_states.rs"
required-features = ["native"]

[[bin]]
name = "choice-states"
path = "src/bin/choice_states.rs"
required-features = ["native"]

[[bin]]
name = "table-states"
path = "src/bin/table_states.rs"
required-features = ["native"]

[[bin]]
name = "table-clipboard"
path = "src/bin/table_clipboard.rs"
required-features = ["native"]

[[bin]]
name = "collection-updates"
path = "src/bin/collection_updates.rs"
required-features = ["native"]

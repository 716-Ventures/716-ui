[package]
name = "seven-sixteen-ui"
version = "0.1.0-alpha.16"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Experimental native GTK 4 controls with a pinned shadcn reference"
repository = "https://github.com/716-Ventures/716-ui"

[features]
default = ["native"]
native = ["dep:gtk"]
terminal = ["native", "dep:vte"]

[[bin]]
name = "gallery"
path = "src/bin/gallery.rs"
required-features = ["native"]

[dependencies]
serde = {version="1",features=["derive"]}
serde_json = "1"
gtk = { package = "gtk4", version = "=0.9.7", features = ["v4_12"], optional = true }

vte = { package="vte4", version="=0.8.0", optional=true }

[profile.dev]
debug = 0

[profile.release]
debug = 0
